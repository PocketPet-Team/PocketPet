name: analysis

on:
  push:
    branches: [main]
    paths:
      - experiments/analysis/**
      - .github/workflows/analysis.yml
  pull_request:
    paths:
      - experiments/analysis/**
      - .github/workflows/analysis.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Python the package supports and the one used in development.
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: experiments/analysis
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
