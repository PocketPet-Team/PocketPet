[project]
name = "pocketpet-analysis"
version = "0.1.0"
description = "PPK2 charge integration, state/event attribution, and paired bootstrap statistics for PocketPet experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.scripts]
pocketpet-analysis = "pocketpet_analysis.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocketpet_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
